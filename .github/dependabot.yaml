version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint supports TypeScript >=4.8.4 <6.1.0; drop this once it supports 7.x.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
